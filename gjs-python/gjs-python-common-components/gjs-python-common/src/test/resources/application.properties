#
# application.properties
# Test de Configuración de la aplicación.
# Formato: clave = valor  (espacios alrededor del = son opcionales)
# Líneas que empiezan con # son comentarios.

# Aplicación 
app.name    		= test-sample
app.version 		= 1.0.0

# Cache de la aplicación 
app.cache.enabled 	= true 
app.cache.directory	= download 

# Base de datos 
db.url			    = postgresql://user:password@localhost:5432/mydb
db.echo     		= false

# Servicio 
app.port    		= 8000



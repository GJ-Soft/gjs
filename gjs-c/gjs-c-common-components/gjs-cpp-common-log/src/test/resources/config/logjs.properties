# Configuracion de prueba: consola y fichero.
#
# Los valores NO van entre comillas: en formato properties de Java las comillas
# serian parte del valor, y ToBool ( "\"true\"" ) daria falso.
log.nombre=${project.artifactId}
log.directorio=${gjs.nar.build.testDirectory}/log

log.consola.activa=true
log.fichero.activo=true
